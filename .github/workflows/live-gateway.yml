name: Verify public TapeExit gateway
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx tools/verify-live-gateway.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-gateway-verification
          path: release-artifacts/live-gateway/
