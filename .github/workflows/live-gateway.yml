name: Verify public TapeExit gateways
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Published checks the pinned uploaded release; candidate rebuilds HEAD; historical checks the original release'
        type: choice
        options: [published, candidate, historical]
        default: published
      protocol:
        description: 'Existing mainnet transaction to recover without connecting a wallet'
        type: choice
        options: [spark, v3]
        default: spark
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:gateway
      - run: npx playwright install --with-deps chromium
      - if: inputs.release == 'published' && inputs.protocol == 'spark'
        run: npx tsx tools/verify-live-gateway.ts docs/published-gateway-profile.json docs/gateway-recovery-task-spark.json
      - if: inputs.release == 'published' && inputs.protocol == 'v3'
        run: npx tsx tools/verify-live-gateway.ts docs/published-gateway-profile.json docs/gateway-recovery-task-67042.json
      - if: inputs.release == 'candidate'
        run: |
          npm run build
          npm run prepare:gateway-update
          npx tsx tools/verify-live-gateway.ts release-artifacts/gateway-update/profile.json docs/gateway-recovery-task-67042.json
      - if: inputs.release == 'historical'
        run: npx tsx tools/verify-live-gateway.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-gateway-verification
          path: release-artifacts/live-gateway/
