name: Verify Spark vault deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:vault-fork
      - run: npm run verify:vault-wallet-fork
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-vault-verification
          path: release-artifacts/spark-vault/
