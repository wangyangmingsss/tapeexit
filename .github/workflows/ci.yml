name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=json --outputFile=release-artifacts/unit-tests.json
      - run: npm run vendor:tapekit
      - run: npm run test:tapekit
      - run: npm run build:gateway
      - run: npm run build
      - run: npm run check:release
      - run: npm run report:performance
      - run: npm run report:dependencies
      - run: npm run report:dependency-scope
      - run: npm run verify:reproducibility
      - run: npm run prepare:review
      - run: npm run build:demo
      - run: npm run print:card
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run report:compatibility
      - run: npm run record:demo
      - run: npm run report:users
      - run: npm run model:business
      - run: npm run report:pilots
      - run: npm run report:readiness
      - run: npm run package:entry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            test-results/
            dist/release-manifest.json
            release-artifacts/
