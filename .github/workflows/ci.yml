name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=json --outputFile=release-artifacts/unit-tests.json
      - run: npm run vendor:tapekit
      - run: npm run test:tapekit
      - run: npm run build
      - run: npm run check:release
      - run: npm run report:dependencies
      - run: npm run report:dependency-scope
      - run: npm run verify:reproducibility
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            test-results/
            dist/release-manifest.json
            release-artifacts/
