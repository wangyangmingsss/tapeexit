name: Publish Isolated Demo
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: isolated-demo-pages
  cancel-in-progress: false
jobs:
  demo:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:demo -- --base=/tapeexit/
      - name: Include Chinese competition pitch
        run: |
          mkdir -p dist-demo/pitch
          cp docs/competition/player.html dist-demo/pitch/index.html
          cp docs/competition/media/TapeExit-Competition-Pitch.mp4 docs/competition/media/TapeExit-Pitch.zh.srt docs/competition/media/poster.png dist-demo/pitch/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
      - uses: actions/deploy-pages@v4
        id: deployment
